spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: shopping_cart_service_route
          uri: lb://shopping-cart
          predicates:
            - Path=/shopping-cart/**
          filters:
            - name: PrefixPath
              args:
                prefix: /api/v1
        - id: shopping_store_service_route
          uri: lb://shopping-store
          predicates:
            - Path=/shopping-store/**
          filters:
            - name: PrefixPath
              args:
                prefix: /api/v1
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, NOT_FOUND
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2s
                  factor: 2
                  basedOnPreviousValue: true
        - id: warehouse_service_route
          uri: lb://warehouse
          predicates:
            - Path=/warehouse/**
          filters:
            - name: PrefixPath
              args:
                prefix: /api/v1
        - id: order_service_route
          uri: lb://order-service
          predicates:
            - Path=/order/**
          filters:
            - name: PrefixPath
              args:
                prefix: /api/v1
        - id: payment_service_route
          uri: lb://payment-service
          predicates:
            - Path=/payment/**
          filters:
            - name: PrefixPath
              args:
                prefix: /api/v1
        - id: delivery_service_route
          uri: lb://delivery-service
          predicates:
            - Path=/delivery/**
          filters:
            - name: PrefixPath
              args:
                prefix: /api/v1


server:
  port: 8080
